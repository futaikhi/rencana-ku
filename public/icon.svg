<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#27272A" stroke-width="4" />

  <!-- Bento Grid Group -->
  <g transform="translate(68, 68)" filter="url(#shadow)">
    <!-- Bento Tile 1: Coral Milestone/Spark (Large vertical or wide top) -->
    <rect x="0" y="0" width="220" height="176" rx="36" fill="url(#roseGrad)" stroke="#000000" stroke-width="6" />
    <!-- Sparkle / Star in Tile 1 -->
    <path d="M110,48 L118,78 L148,88 L118,98 L110,128 L102,98 L72,88 L102,78 Z" fill="#FFFFFF" />

    <!-- Bento Tile 2: Golden Amber Goal Tracker -->
    <rect x="238" y="0" width="138" height="176" rx="36" fill="url(#amberGrad)" stroke="#000000" stroke-width="6" />
    <!-- Progress Bars / Checklist in Tile 2 -->
    <circle cx="282" cy="58" r="12" fill="#000" />
    <rect x="306" y="52" width="46" height="12" rx="6" fill="#000" />
    <circle cx="282" cy="94" r="12" fill="#000" />
    <rect x="306" y="88" width="46" height="12" rx="6" fill="#000" />
    <circle cx="282" cy="130" r="12" fill="#000" />
    <rect x="306" y="124" width="46" height="12" rx="6" fill="#000" />

    <!-- Bento Tile 3: Emerald Target & Success -->
    <rect x="0" y="194" width="146" height="182" rx="36" fill="url(#tealGrad)" stroke="#000000" stroke-width="6" />
    <!-- Target icon in Tile 3 -->
    <circle cx="73" cy="285" r="42" fill="none" stroke="#FFFFFF" stroke-width="8" />
    <circle cx="73" cy="285" r="22" fill="none" stroke="#FFFFFF" stroke-width="7" />
    <circle cx="73" cy="285" r="8" fill="#FFFFFF" />

    <!-- Bento Tile 4: Cream / White PlanCraft Monogram -->
    <rect x="164" y="194" width="212" height="182" rx="36" fill="#FAF8F5" stroke="#000000" stroke-width="6" />
    <!-- Bold Typography Monogram: 'P' + 'C' stylized -->
    <text x="210" y="306" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="80" fill="#18181B" letter-spacing="-2">PC</text>
  </g>
</svg>